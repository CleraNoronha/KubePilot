apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepilot-health
  labels:
    app.kubernetes.io/name: kubepilot-health
    app.kubernetes.io/part-of: kubepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubepilot-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubepilot-health
        app.kubernetes.io/part-of: kubepilot
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
